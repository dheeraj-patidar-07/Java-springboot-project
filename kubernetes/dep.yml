apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: dheerajptdr/frontend:v1
        ports:
        - containerPort: 8501
        env:
        - name: API_URL
          value: "http://backend-service:8084"
